<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Radiant Candlelight Bloom -->
    <radialGradient id="candleGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ff5722" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Candle Flame Gradient -->
    <linearGradient id="outerFlame" x1="50" y1="10" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="35%" stop-color="#ff9800" />
      <stop offset="85%" stop-color="#ff3d00" />
      <stop offset="100%" stop-color="#dd2c00" />
    </linearGradient>

    <!-- Inner Incandescent Flame Core -->
    <linearGradient id="innerCore" x1="50" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fff9c4" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>

    <!-- Letter M Facet Gradient -->
    <linearGradient id="mGradient" x1="50" y1="36" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="60%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>

  <!-- 1. Ambient Warm Candle Glow -->
  <circle cx="50" cy="34" r="36" fill="url(#candleGlow)" />

  <!-- 2. The Architectural Letter "M" -->
  <path
    d="M 16 84 
       L 16 43 
       C 16 38.5 19.5 35.5 24 37.5 
       L 50 56 
       L 76 37.5 
       C 80.5 35.5 84 38.5 84 43 
       L 84 84 
       C 84 86.5 82 88 79.5 88 
       L 72.5 88 
       C 70 88 68 86.5 68 84 
       L 68 53 
       L 53 64.5 
       C 51.2 65.8 48.8 65.8 47 64.5 
       L 32 53 
       L 32 84 
       C 32 86.5 30 88 27.5 88 
       L 20.5 88 
       C 18 88 16 86.5 16 84 Z"
    fill="url(#mGradient)"
  />

  <!-- 3. Candle Wick (Anchoring Flame to Valley of M) -->
  <line x1="50" y1="46" x2="50" y2="55" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

  <!-- 4. Candle Flame Outer Teardrop -->
  <path
    d="M 50 10 
       C 55 22, 63 29, 63 38 
       C 63 45.5, 57.2 51, 50 51 
       C 42.8 51, 37 45.5, 37 38 
       C 37 29, 45 22, 50 10 Z"
    fill="url(#outerFlame)"
  />

  <!-- 5. Inner White-Hot Candlelight Core -->
  <path
    d="M 50 24 
       C 52.8 29.5, 56.5 34, 56.5 39 
       C 56.5 43.5, 53.8 47, 50 47 
       C 46.2 47, 43.5 43.5, 43.5 39 
       C 43.5 34, 47.2 29.5, 50 24 Z"
    fill="url(#innerCore)"
  />
</svg>
